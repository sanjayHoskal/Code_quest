<!DOCTYPE html>
<html>
<head>
    <title>Level 1 - CodeQuest</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            margin: 0;
        }

        .header {
            background: #263238;
            color: white;
            padding: 25px;
        }

        .game-box {
            background: white;
            max-width: 750px;
            margin: 50px auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .level {
            font-size: 20px;
            font-weight: bold;
        }

        .question {
            margin: 30px 0;
            font-size: 21px;
        }

        input {
            width: 70%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            margin-top: 20px;
            padding: 13px 30px;
            border: none;
            border-radius: 7px;
            background: #1976d2;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .info {
            margin-top: 25px;
            font-size: 17px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🎮 CodeQuest</h1>
        <p>{{ language }} Challenge</p>
    </div>

    <div class="game-box">

        <div class="level">
            ⭐ Level 1 — Beginner
        </div>

        <div class="question">
            <p>{{ question }}</p>
        </div>

        <form action="/check_answer" method="POST">

            <input type="hidden" name="language" value="{{ language }}">
            <input type="hidden" name="correct_answer" value="{{ correct_answer }}">

            <input
                type="text"
                name="answer"
                placeholder="Type your answer"
                required
            >

            <br>

            <button type="submit">Submit Answer 🚀</button>

        </form>

        <div class="info">
            ⭐ XP: 0 &nbsp;&nbsp; | &nbsp;&nbsp; 🏆 Level: 1
        </div>

    </div>

</body>
</html>
