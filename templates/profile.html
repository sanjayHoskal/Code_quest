<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Profile - CodeQuest</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <script src="/static/js/sound_effects.js"></script>
    <style>
        .profile-card {
            max-width: 500px;
            margin: 60px auto;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 45px 35px;
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(20px);
            text-align: center;
        }
        .avatar-circle {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 20px;
            margin: 25px 0;
            display: flex;
            justify-content: space-around;
        }
        .stat-col {
            text-align: center;
        }
        .stat-value {
            font-family: var(--font-heading);
            font-size: 28px;
            font-weight: 800;
            color: #fbbf24;
            display: block;
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <nav class="app-nav">
        <a href="/" class="brand">
            <span class="brand-icon">🎮</span>
            <div>
                <h1 class="brand-title">CodeQuest</h1>
                <p class="brand-subtitle">Level Up Your Code</p>
            </div>
        </a>
        <div class="nav-actions">

            <a href="/" class="nav-pill">🏠 Home</a>
            <a href="/start_game" class="nav-pill nav-pill-primary">🚀 Play Quest</a>
            <a href="/logout" class="nav-pill" style="border-color: rgba(239, 68, 68, 0.3); color: #f87171;">🚪 Logout</a>
        </div>
    </nav>

    <div class="profile-card">
        <div class="avatar-circle">👾</div>
        <h2 class="gradient-title" style="font-size: 30px; margin-bottom: 4px;">{{ user.username }}</h2>
        <p style="color: var(--text-secondary); font-size: 14px; margin-top: 0;">{{ user.email }}</p>

        <div class="stat-box">
            <div class="stat-col">
                <span class="stat-value">⭐ {{ user.total_xp }}</span>
                <span class="stat-label">Total XP</span>
            </div>
            <div class="stat-col">
                <span class="stat-value" style="color: #38bdf8;">{{ user.role|capitalize }}</span>
                <span class="stat-label">Role</span>
            </div>
        </div>

        <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <a href="/start_game" class="btn-primary" style="width: auto; padding: 12px 24px;">🚀 Start Quest</a>
            <a href="/leaderboard" class="btn-secondary">🏆 View Ranking</a>
        </div>
    </div>

</body>
</html>
