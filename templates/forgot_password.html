<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CodeQuest</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        .auth-card {
            max-width: 440px;
            margin: 60px auto;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(20px);
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.25s ease;
        }
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
    </style>
</head>
<body>

    <nav class="app-nav">
        <a href="/" class="brand">
            <span class="brand-icon">🎮</span>
            <div>
                <h1 class="brand-title">CodeQuest</h1>
                <p class="brand-subtitle">Level Up Your Code</p>
            </div>
        </a>
        <div class="nav-actions">
            <a href="/" class="nav-pill">🏠 Home</a>
            <a href="/login" class="nav-pill nav-pill-primary">🔑 Sign In</a>
        </div>
    </nav>

    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 30px;">
            <div style="font-size: 42px; margin-bottom: 10px;">🔒</div>
            <h2 class="gradient-title" style="font-size: 28px; margin-bottom: 6px;">Reset Password</h2>
            <p style="color: var(--text-secondary); font-size: 14px; margin: 0;">Enter your email to receive a reset link</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-input" placeholder="Enter your email" required>
            </div>

            <button type="submit" class="btn-primary" style="margin-top: 10px;">
                Send Reset Link ➔
            </button>
        </form>

        <p style="text-align: center; margin-top: 25px; font-size: 14px; color: var(--text-secondary);">
            Remembered your password? <a href="/login" style="color: #38bdf8; text-decoration: none; font-weight: 700;">Sign in here</a>
        </p>
    </div>

</body>
</html>
